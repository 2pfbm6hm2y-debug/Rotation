<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tracks what you wear and suggests outfits that haven't been repeated too soon.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotation">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/fan-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/fan-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column. Today is a freshness picker, clothes carry pinked fabric swatches, tab bar at the bottom. */
:root{
  --paper:#F8F3F5; --card:#FFFFFF; --sunk:#F0E7EB; --line:#E5D9DF; --ink:#221B20; --ink2:#51464D; --muted:#76696F;
  --accent:#B92E64; --accent-ink:#FFFFFF; --accent-soft:#FBE3EC; --soga:#8C5A2E;
  --ready:#1D7449; --ready-soft:#DCEFE3; --rest:#8F5E00; --rest-soft:#FAEDCB; --wash:#2B67A6; --wash-soft:#DEEAF7; --clash:#AD3F17; --clash-soft:#FAE3D8; --heart:#B92E64;
  --scrim:rgba(34,18,26,.45); --shadow:0 1px 2px rgba(60,20,40,.05),0 8px 24px rgba(60,20,40,.07);
  --toast-bg:#221B20; --toast-fg:#F8F3F5; --toast-link:#FFB3CC; --tabs-bg:rgba(255,255,255,.92);
  --display:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --label:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --tabh:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#151114; --card:#1F1A1D; --sunk:#2A2327; --line:#382F34; --ink:#F2EAEE; --ink2:#C9BCC3; --muted:#9C8E95;
    --accent:#F591B4; --accent-ink:#1F0D16; --accent-soft:#3E1F2C; --soga:#D19A66;
    --ready:#5CC491; --ready-soft:#15291F; --rest:#EDC15C; --rest-soft:#33290F; --wash:#7DB3EC; --wash-soft:#16263A; --clash:#F5946A; --clash-soft:#3A2116; --heart:#F591B4;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --toast-bg:#F2EAEE; --toast-fg:#151114; --toast-link:#B92E64; --tabs-bg:rgba(31,26,29,.92);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#151114; --card:#1F1A1D; --sunk:#2A2327; --line:#382F34; --ink:#F2EAEE; --ink2:#C9BCC3; --muted:#9C8E95;
  --accent:#F591B4; --accent-ink:#1F0D16; --accent-soft:#3E1F2C; --soga:#D19A66;
  --ready:#5CC491; --ready-soft:#15291F; --rest:#EDC15C; --rest-soft:#33290F; --wash:#7DB3EC; --wash-soft:#16263A; --clash:#F5946A; --clash-soft:#3A2116; --heart:#F591B4;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --toast-bg:#F2EAEE; --toast-fg:#151114; --toast-link:#B92E64; --tabs-bg:rgba(31,26,29,.92);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px calc(var(--tabh) + 36px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.08;font-weight:700;letter-spacing:-.02em}
h2{font-size:19px;line-height:1.2;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.eyebrow,.lab{font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap;position:relative}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;color:var(--accent);padding-inline:10px}
.btn.small{min-height:34px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--clash)}
.btn.armed{background:var(--clash);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover,.btn.quiet:hover{background:var(--sunk)}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

/* header */
.hero{display:grid;gap:10px;padding-block:14px 6px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--label);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:500}
.date-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.date-row h1{min-width:0}
.datepick{position:relative;overflow:hidden}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);text-align:center}
.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 4px}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:22px 10px}

.banner{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:10px}
.banner p{flex:1 1 220px;min-width:0}
.banner.outline{background:var(--card);border:1px solid var(--line)}
.note{font-size:13.5px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.note.rest{background:var(--rest-soft);border-color:transparent;color:var(--ink)}

/* swatches: pinked fabric edge */
.sw{--c:#ccc;width:22px;height:26px;flex:none;border-radius:4px 4px 0 0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(127,127,140,.35);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 4px) no-repeat,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/6px 4px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 4px) no-repeat,conic-gradient(from -45deg at bottom,#000 90deg,#0000 0) bottom/6px 4px repeat-x}
.sw.sm{width:14px;height:17px;border-radius:3px 3px 0 0;-webkit-mask-size:100% calc(100% - 3px),4px 3px;mask-size:100% calc(100% - 3px),4px 3px}
.sw.batik{background:radial-gradient(circle,#E8D2A6 22%,transparent 25%) 0 0/7px 7px,radial-gradient(circle,#2B1B12 18%,transparent 21%) 3.5px 3.5px/7px 7px,#7A4B2A}
.sw.stripes{background:repeating-linear-gradient(90deg,#F4F2EE 0 3px,#C43C3A 3px 5px)}
.sw.other{background:repeating-linear-gradient(135deg,var(--sunk) 0 3px,var(--card) 3px 6px)}

/* hang-tag suggestion cards */
.tags{display:grid;gap:14px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.tag-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--line);font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hole{width:10px;height:10px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.tag-facts{margin-left:auto;text-align:right;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag-facts .liked{color:var(--heart)}
.tag-facts .fresh{color:var(--ready)}
.tag-facts .warn{color:var(--rest)}
.pieces{padding:2px 6px 2px 14px}
.piece{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0}
.piece + .piece{border-top:1px solid var(--sunk)}
.pc-btns{display:flex}
.pc-name{font-weight:600;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.pc-meta{font-size:13px;color:var(--muted)}
.pc-meta .rest{color:var(--rest);font-weight:600}
.add-layer{display:inline-flex;align-items:center;gap:10px;margin:2px 0 10px;padding:7px 12px 7px 9px;border:1px dashed var(--line);border-radius:10px;color:var(--ink2);font-size:14px;max-width:100%}
.add-layer span{overflow-wrap:anywhere}
.add-layer b{color:var(--accent);font-weight:600}
.tag-actions{display:flex;gap:6px;padding:8px 10px 12px 14px;align-items:center}
.tag-actions .primary{flex:1}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.warn-line{margin:0 14px 4px;font-size:13px;color:var(--rest)}

.worn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px 14px;display:grid;gap:8px}
.worn-card + .worn-card{margin-top:10px}
.chips-inline{display:flex;flex-wrap:wrap;gap:6px 14px}
.chip-piece{display:inline-flex;align-items:center;gap:7px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.worn-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:550;color:var(--ink2);background:var(--card)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pill{font-family:var(--label);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ready{background:var(--ready-soft);color:var(--ready)}
.pill.rest{background:var(--rest-soft);color:var(--rest)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--sunk);color:var(--muted)}
.occ-tag{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soga)}

/* closet */
.search{position:relative;margin-block:12px 10px}
input[type="search"],input[type="text"],input[type="date"],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:0 12px;font-size:16px}
textarea{padding:10px 12px;min-height:120px;font-family:var(--label);font-size:12px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.filters{display:grid;gap:8px}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.sortrow select{width:auto;min-height:36px;font-size:14px}
.grp{display:flex;justify-content:space-between;padding:20px 4px 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding-inline:12px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:11px 0}
.row + .row{border-top:1px solid var(--sunk)}
.row-name{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.row-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-when{font-family:var(--label);font-size:11px;color:var(--muted)}
.row[aria-pressed="true"]{background:linear-gradient(90deg,var(--accent-soft),transparent 80%);margin-inline:-12px;padding-inline:12px;width:calc(100% + 24px)}
.row .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.row[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row .tick svg{width:14px;height:14px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px 16px;color:var(--ink2);display:grid;gap:12px;justify-items:start;font-size:14.5px}

/* history */
.month{margin-block:22px 8px}
.day{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.entry-row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.day-date{display:grid;justify-items:center;align-content:start;padding-top:2px}
.day-date b{font-family:var(--display);font-size:24px;line-height:1;font-weight:700}
.day-date span{font-family:var(--label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.entry{display:grid;gap:6px;width:100%;padding:4px 0}
.entry + .entry{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}

/* pairs */
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0}
.pair + .pair{border-top:1px solid var(--sunk)}
.pair-items{display:grid;gap:7px}
.ptop{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:12px 0}
.ptop + .ptop{border-top:1px solid var(--sunk)}
.goes-list{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.goes-list .chip-piece{font-size:13.5px;color:var(--ink2)}
.nogo{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.match-head{display:flex;gap:12px;align-items:center;padding:4px 0 10px;position:sticky;top:-4px;z-index:2;background:var(--card);border-bottom:1px solid var(--sunk);margin-bottom:10px}
.match-head .sw{width:28px;height:34px}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0}
.mrow + .mrow{border-top:1px solid var(--sunk)}
.mrow.yes{background:linear-gradient(90deg,var(--ready-soft),transparent 85%);border-radius:10px;margin-inline:-6px;padding-inline:6px}
.mrow.no .row-name{color:var(--muted)}
.tri{display:flex;gap:6px}
.tri button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--card)}
.tri svg{width:18px;height:18px}
.tri button[data-v="yes"][aria-pressed="true"]{background:var(--ready);border-color:var(--ready);color:var(--card)}
.tri button[data-v="no"][aria-pressed="true"]{background:var(--clash);border-color:var(--clash);color:var(--card)}
/* photos */
.ootd{display:flex;gap:12px;align-items:center;margin:2px 14px 8px;padding:6px 12px 6px 6px;border-radius:12px;background:var(--sunk);width:calc(100% - 28px);font-size:13.5px;color:var(--ink2)}
.ootd b{color:var(--ink);font-weight:600}
.ootd img,.thumb{width:52px;height:66px;object-fit:cover;border-radius:8px;background:var(--line);flex:none;display:block}
.thumb.sm{width:40px;height:50px;border-radius:7px}
.photo-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photo-strip button{flex:none}
.photo-strip .thumb{width:72px;height:90px}
.viewer{position:fixed;inset:0;z-index:70;background:#0B0B10;animation:fade .15s ease}
.viewer-strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.viewer-strip::-webkit-scrollbar{display:none}
.viewer figure{flex:0 0 100%;scroll-snap-align:center;margin:0;display:grid;grid-template-rows:1fr auto;place-items:center;gap:12px;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;min-height:0}
.viewer figcaption{color:#ECEAF3;font-size:14px;text-align:center;max-width:36ch}
.viewer-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;background:rgba(255,255,255,.14);color:#fff}
/* week */
.pday{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 0}
.pday + .pday{border-top:1px solid var(--sunk)}
.pday.today .day-date b{color:var(--accent)}
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.occ-btn{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soga);padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.occ-btn.skip{color:var(--muted)}
.pentry{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;width:100%;padding:4px 0}
.over{display:block;font-size:12.5px;color:var(--clash);margin-top:4px}
.pill.wash{background:var(--wash-soft);color:var(--wash)}
/* welcome */
.wl{display:grid;justify-items:center;text-align:center;padding:6px 0 4px}
.wl-icon{width:64px;height:64px;margin:4px auto 12px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.wl-icon svg{width:32px;height:32px}
.wl-icon.app{width:76px;height:76px;background:none;overflow:hidden;box-shadow:var(--shadow);display:block;padding:0}
.wl-icon.app svg{width:100%;height:100%;display:block}
.wl-step{font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wl h2{font-size:24px;line-height:1.15;margin-bottom:16px;max-width:22ch}
.wl-body{text-align:left;font-size:15px;line-height:1.5;color:var(--ink2);width:100%}
.wl-body p{margin:0 0 10px}
.wl-body ol{margin:0 0 10px;padding-left:20px;display:grid;gap:6px}
.wl-pp{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.wl-pp li{display:grid;gap:4px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.wl-pp s{font-size:13px;color:var(--muted);text-decoration-thickness:1px}
.wl-pp b{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:600;font-size:15px;line-height:1.35}
.wl-pp svg,.wl-ticks svg{width:14px;height:14px;flex:none;color:var(--ready);margin-top:4px}
.wl-c{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.wl-ticks{list-style:none;padding:0;margin:4px 0 10px;display:grid;gap:9px}
.wl-ticks li{display:flex;gap:9px;align-items:flex-start}
.wl-ticks b{color:var(--ink);font-weight:600}
.wl-mock{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:2px 12px;margin:0 0 14px;font-size:14px;color:var(--ink)}
.wl-mock .tag-head{margin:0 -12px;padding:9px 12px}

<script>
/* Rotation cut-out: removes the background from a clothing photo on the phone.
   Runs the U²-Netp salient-object model (Apache-2.0, github.com/xuebinqin/U-2-Net) on the GPU with WebGL2.
   No network calls: the model (lib/u2netp.json + lib/u2netp.bin) ships with the app. */
const Cutout = (() => {
  const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
out vec4 o;
uniform ivec4 uO;            // out: W, H, cols, CG
ivec3 here(){ ivec2 p = ivec2(gl_FragCoord.xy); int tx = p.x / uO.x, ty = p.y / uO.y; return ivec3(p.x - tx * uO.x, p.y - ty * uO.y, ty * uO.z + tx); }
vec4 at(sampler2D t, ivec4 L, int x, int y, int g){ return texelFetch(t, ivec2((g % L.z) * L.x + x, (g / L.z) * L.y + y), 0); }
float comp(vec4 v, int i){ return i == 0 ? v.x : i == 1 ? v.y : i == 2 ? v.z : v.w; }
`;
  const FS = {
    conv: HEAD + `uniform sampler2D uX, uW; uniform ivec4 uXL; uniform int uK, uDil, uPad, uWB, uBB, uRelu, uWW;
vec4 wf(int i){ return texelFetch(uW, ivec2(i % uWW, i / uWW), 0); }
void main(){ ivec3 q = here(); if (q.z >= uO.w) { o = vec4(0); return; }
  vec4 acc = wf(uBB + q.z); int IG = uXL.w, taps = uK * uK; int wi = uWB + q.z * IG * taps * 4;
  for (int ig = 0; ig < IG; ig++) for (int ky = 0; ky < uK; ky++) for (int kx = 0; kx < uK; kx++) {
    int sx = q.x - uPad + kx * uDil, sy = q.y - uPad + ky * uDil;
    if (sx >= 0 && sy >= 0 && sx < uXL.x && sy < uXL.y) { vec4 v = at(uX, uXL, sx, sy, ig);
      acc += wf(wi) * v.x + wf(wi + 1) * v.y + wf(wi + 2) * v.z + wf(wi + 3) * v.w; }
    wi += 4; }
  o = uRelu == 1 ? max(acc, 0.0) : acc; }`,
    relu: HEAD + `uniform sampler2D uX; uniform ivec4 uXL;
void main(){ ivec3 q = here(); o = q.z < uO.w ? max(at(uX, uXL, q.x, q.y, q.z), 0.0) : vec4(0); }`,
    pool: HEAD + `uniform sampler2D uX; uniform ivec4 uXL;
void main(){ ivec3 q = here(); if (q.z >= uO.w) { o = vec4(0); return; }
  vec4 m = vec4(-1e30); for (int dy = 0; dy < 2; dy++) for (int dx = 0; dx < 2; dx++) { int sx = q.x * 2 + dx, sy = q.y * 2 + dy;
    if (sx < uXL.x && sy < uXL.y) m = max(m, at(uX, uXL, sx, sy, q.z)); }
  o = m; }`,
    up: HEAD + `uniform sampler2D uX; uniform ivec4 uXL;
void main(){ ivec3 q = here(); if (q.z >= uO.w) { o = vec4(0); return; }
  float fx = max((float(q.x) + 0.5) * float(uXL.x) / float(uO.x) - 0.5, 0.0), fy = max((float(q.y) + 0.5) * float(uXL.y) / float(uO.y) - 0.5, 0.0);
  int x0 = min(int(floor(fx)), uXL.x - 1), y0 = min(int(floor(fy)), uXL.y - 1), x1 = min(x0 + 1, uXL.x - 1), y1 = min(y0 + 1, uXL.y - 1);
  float ax = fx - float(x0), ay = fy - float(y0);
  vec4 t = mix(at(uX, uXL, x0, y0, q.z), at(uX, uXL, x1, y0, q.z), ax), b = mix(at(uX, uXL, x0, y1, q.z), at(uX, uXL, x1, y1, q.z), ax);
  o = mix(t, b, ay); }`,
    cat: HEAD + `uniform sampler2D uA, uB; uniform ivec4 uAL, uBL; uniform int uCA, uCB;
float ch(int c, int x, int y){ if (c < uCA) return comp(at(uA, uAL, x, y, c / 4), c % 4); c -= uCA; if (c < uCB) return comp(at(uB, uBL, x, y, c / 4), c % 4); return 0.0; }
void main(){ ivec3 q = here(); if (q.z >= uO.w) { o = vec4(0); return; } int c = q.z * 4;
  o = vec4(ch(c, q.x, q.y), ch(c + 1, q.x, q.y), ch(c + 2, q.x, q.y), ch(c + 3, q.x, q.y)); }`,
    add: HEAD + `uniform sampler2D uA, uB; uniform ivec4 uAL, uBL;
void main(){ ivec3 q = here(); o = q.z < uO.w ? at(uA, uAL, q.x, q.y, q.z) + at(uB, uBL, q.x, q.y, q.z) : vec4(0); }`,
    sig: HEAD + `uniform sampler2D uX; uniform ivec4 uXL;
void main(){ ivec3 q = here(); o = q.z < uO.w ? 1.0 / (1.0 + exp(-at(uX, uXL, q.x, q.y, q.z))) : vec4(0); }`,
    out: HEAD + `uniform sampler2D uX; uniform ivec4 uXL;
void main(){ ivec3 q = here(); o = vec4(clamp(at(uX, uXL, q.x, q.y, 0).x, 0.0, 1.0)); }`
  };

/* Week: plan ahead, laundry, and what was worn */
function renderWeek() {
  const today = todayStr(), days = Array.from({ length: UI.weekDays }, (_, n) => addDays(today, n));
  const empty = days.filter(d => d > today && planOcc(d) !== 'skip' && !D.logs.some(l => l.date === d)).length;
  let h = `${sampleBanner()}<div class="page-head"><div><h1>Week</h1><p class="sub">Plan the days ahead.</p></div><button class="btn small primary" data-act="log-new">Log outfit</button></div>`;
  h += `<div class="sec-head"><h2>Coming up</h2>${empty ? `<button class="btn small primary" data-act="plan-fill">Plan ${plural(empty, 'empty day')}</button>` : ''}</div>`;
  h += `<div class="list">${days.map(planRow).join('')}</div>`;
  h += `<p class="help">Planned outfits count as worn on their day, so the picker keeps those pieces fresh and clean for it. Tap an occasion to change it, or set a day to <b>No plan</b>.</p>`;
  h += `<div style="margin-top:8px"><button class="btn small" data-act="plan-more">Show 7 more days</button></div>`;
  h += `<div class="sec-head"><h2>Worn</h2></div>`;

}
function planRow(d) {
  const today = todayStr(), logs = D.logs.filter(l => l.date === d), occ = planOcc(d);
  const label = occ === 'skip' ? 'No plan' : occ === 'any' ? 'Any' : occName(occ);
  let body;
  if (logs.length) body = logs.map(l => {
    const over = overLimit(l), ph = l.photo ? l : comboPhotos(mainKey(l.items), l.id).find(x => x.date <= today);
    return `<button class="pentry" data-act="${d > today ? 'plan-edit' : 'log-edit'}" data-id="${l.id}"><span><span class="chips-inline">${piecesOf(l.items).map(i => `<span class="chip-piece">${sw(i, true)}<span>${esc(i.name)}</span></span>`).join('')}</span>
      ${over.length ? `<span class="over">Past the laundry limit: ${over.map(i => esc(i.name)).join(', ')}</span>` : ''}</span>${ph ? `<img class="thumb sm" data-photo="${ph.photo}" alt="">` : ''}</button>`;
  }).join('');
  else body = occ === 'skip' ? '<span class="small muted">Nothing to plan</span>' : `<button class="link" data-act="plan-pick" data-d="${d}">Pick an outfit</button>`;

function historyList(logs) {

  let h = '';
  const byMonth = new Map();
  for (const l of logs) { const m = l.date.slice(0, 7); if (!byMonth.has(m)) byMonth.set(m, new Map()); const days = byMonth.get(m); if (!days.has(l.date)) days.set(l.date, []); days.get(l.date).push(l); }
  for (const [m, days] of byMonth) {
    h += `<div class="month"><span class="lab">${esc(fmt(m + '-01', { month: 'long', year: 'numeric' }))}</span></div>`;

      const piece = i => `<span class="chip-piece">${sw(i, true)}<span>${esc(i.name)}</span></span>`;
      let inner = own.map(l => `<button class="entry" data-act="log-edit" data-id="${l.id}"><span class="entry-row"><span><span class="chips-inline">${piecesOf(l.items).map(piece).join('') || '<span class="muted">Piece was deleted</span>'}</span>

      if (xp.length) inner += `<div class="entry"><span class="chips-inline">${xp.map(i => `<button class="chip-piece" data-act="item" data-id="${i.id}">${sw(i, true)}<span>${esc(i.name)}</span></button>`).join('')}</span><span class="occ-tag">Imported</span></div>`;

}
function planFill() {
  const today = todayStr(); let made = 0;
  commit(() => (made ? `Planned ${plural(made, 'day')}` : 'Nothing clean to plan with. Check the laundry.'), () => {
    for (let n = 1; n < UI.weekDays; n++) {
      const d = addDays(today, n), occ = planOcc(d);
      if (occ === 'skip' || D.logs.some(l => l.date === d)) continue;
      reindex(); // so each new plan counts for the next day
      const P = newPicker(d, occ), ids = [P.top, P.bottom].filter(Boolean);
      if (ids.length < 2 || !ids.every(id => st(IX.byId.get(id), d).clean)) continue;
      if (ids.some(id => IX.byId.get(id).needsLayer)) { const l = freshExtra('layer', ids, d, occ); if (l) ids.push(l); }
      D.logs.push({ id: uid(), date: d, items: ids, occ: occ === 'any' ? null : occ, src: 'plan', created: Date.now() + n });
      made++;

  });
}

/* end of the day: hang it up or put it in the basket */
const EVENING = 17;   // from 5pm, today's outfit asks to be sorted on Today
// clothes in an outfit still to sort: not washed since, and no choice made yet
function sortItems(l) {
  const out = [];
  for (const id of l.items) {
    const i = IX.byId.get(id); if (!i || isAcc(i.type) || (l.after && l.after[id])) continue;
    const ws = washesFor(id); if (ws.some(w => washedBy(l, w))) continue;
    const prevW = [...ws].reverse().find(w => !washedBy(l, w)) || null, lim = limitOf(i);
    const before = (IX.logsBy.get(id) || []).filter(x => x !== l && logCmp(x, l) <= 0 && (!prevW || !washedBy(x, prevW)));
    const load = before.reduce((a, x) => a + wearLoad(x, id, lim), 0);
    out.push({ i, n: before.length + 1, def: load + 1 >= lim ? 'basket' : 'hang' });
  }
  return out;
}
// outfits from the last three days still to sort, newest first. onToday leaves out today's before the evening.
function sortQueue(onToday) {
  const today = todayStr(), from = addDays(today, -3), evening = new Date().getHours() >= EVENING;
  return D.logs.filter(l => l.date <= today && l.date >= from && l.src !== 'import' && !(onToday && l.date === today && !evening) && sortItems(l).length)

}

/* pair rules, set from a piece's page */
function matchList(it, v) {
  const other = it.type === 'top' ? 'bottom' : 'top';
  const src = v === 'yes' ? D.liked : D.clash;
  return Object.keys(src).filter(k => k.split('|').includes(it.id)).map(k => IX.byId.get(k.split('|').find(x => x !== it.id))).filter(o => o && o.type === other);
}
/* match sheet: tick which bottoms go with a top, or which tops go with a bottom */
function openMatch(id, queue) {
  const it = IX.byId.get(id); if (!it || (it.type !== 'top' && it.type !== 'bottom')) return;
  const other = it.type === 'top' ? 'bottom' : 'top';
  const state = {};
  for (const p of D.items) if (p.type === other) { const k = pk(id, p.id); state[p.id] = D.liked[k] ? 'yes' : D.clash[k] ? 'no' : ''; }
  const only = it.only === true || !IX.ticks.get(id);
  SH = { kind: 'match', id, other, state, only, q: '', queue: queue || null };
  const pos = queue ? queue.indexOf(id) : -1;
  const b = `<div class="match-head">${sw(it)}<div style="min-width:0"><div class="pc-name">${esc(it.name)}</div><div class="small muted">${esc(occList(it))}${pos >= 0 ? ` · ${T1[it.type]} ${pos + 1} of ${queue.length}` : ''}</div><div class="small num" id="mCount"></div></div></div>
    <p class="lede">Tick the ${other}s that go with it. Cross out the ones that don't.</p>
    <label class="check"><input type="checkbox" id="mOnly" ${only ? 'checked' : ''}><span>Only pair it with the ticked ${other}s<small>When off, ticked ones are preferred and the rest are still allowed</small></span></label>
    <div class="field"><input type="search" id="mQ" placeholder="Search ${other}s" autocomplete="off" aria-label="Search"></div>
    <div class="list" id="mList" style="margin-top:10px"></div>`;
  const next = pos >= 0 && pos < queue.length - 1;
  openSheet(`Match ${T1[it.type].toLowerCase()}`, b, `<button class="btn ${next ? '' : 'primary'}" data-act="m-save">Save</button>${next ? `<button class="btn primary" data-act="m-next">Save and next ${T1[it.type].toLowerCase()}</button>` : ''}`);
  refreshMatch();
}
function refreshMatch() {
  const q = SH.q.trim().toLowerCase();
  const ps = D.items.filter(p => p.type === SH.other && (!q || p.name.toLowerCase().includes(q)));
  $('#mList').innerHTML = ps.length ? ps.map(p => { const v = SH.state[p.id]; return `<div class="mrow ${v}">${sw(p)}<span><span class="row-name">${esc(p.name)}</span><span class="row-meta">${esc(occList(p))}${p.out ? ' · off' : ''}</span></span>
    <span class="tri"><button data-act="m-set" data-id="${p.id}" data-v="yes" aria-pressed="${v === 'yes'}" aria-label="Goes with it">${ICON.check}</button><button data-act="m-set" data-id="${p.id}" data-v="no" aria-pressed="${v === 'no'}" aria-label="Doesn't go">${ICON.x}</button></span></div>`; }).join('')
    : '<p class="small muted" style="padding:14px 0">No matches.</p>';
  updateMatchCount();
}
function updateMatchCount() {
  const vals = Object.values(SH.state), y = vals.filter(v => v === 'yes').length, n = vals.filter(v => v === 'no').length;
  $('#mCount').textContent = `${y} go with it · ${n} don't${SH.only && !y ? ` · tick at least one, or it can go with any ${SH.other}` : ''}`;
}
function saveMatch(msg) {
  const { id, state, only } = SH, t = todayStr();
  commit(msg || null, () => {
    for (const [pid, v] of Object.entries(state)) {
      const k = pk(id, pid);
      if (v === 'yes') { D.liked[k] = D.liked[k] || { at: t }; delete D.clash[k]; }
      else if (v === 'no') { D.clash[k] = D.clash[k] || { at: t }; delete D.liked[k]; }
      else { delete D.liked[k]; delete D.clash[k]; }
    }
    const it = D.items.find(x => x.id === id); if (it) it.only = only;
  });
}

  const id = SH.id;

  commit(id ? 'Saved' : `Added ${name}`, () => {

function addWear(id, date) {
  const it = IX.byId.get(id); if (!it) return;
  commit(`Added ${it.name} to ${date === todayStr() ? 'today' : fmtShort(date)}`, () => {
    const ty = x => (IX.byId.get(x) || {}).type;
    const fits = l => !l.items.includes(id) && (isAcc(it.type) ? !l.items.some(x => ty(x) === it.type)
      : it.type === 'layer' || !l.items.some(x => ty(x) === it.type || ty(x) === 'dress' || (it.type === 'dress' && (ty(x) === 'top' || ty(x) === 'bottom'))));
    if (D.logs.some(x => x.date === date && x.items.includes(id))) return;
    const l = D.logs.find(x => x.date === date && x.src !== 'import' && fits(x));
    if (l) l.items.push(id);
    else D.logs.push({ id: uid(), date, items: [id], occ: date === UI.date && UI.occ !== 'any' ? UI.occ : null, src: date > todayStr() ? 'plan' : 'app', created: Date.now() });
  });

    case 'laundry-open': openLaundry(); break;
    case 'laundry-all': document.querySelectorAll('input[name="wash"]').forEach(x => { x.checked = true; }); break;
    case 'laundry-save': saveLaundry(); break;
    case 'wash-item': { const id = el.dataset.id; closeSheet(); commit(`Marked ${IX.byId.get(id).name} as washed`, () => { D.washes.push({ id: uid(), date: todayStr(), at: Date.now(), items: [id] }); }); openItem(id); break; }
    case 'washlim': { const k = el.dataset.k, v = Math.max(1, Math.min(10, D.wash[k] + Number(el.dataset.d))); if (v === D.wash[k]) return; commit(null, () => { D.wash[k] = v; }); break; }
    case 'photo-add': UI.photoFor = el.dataset.log; $('#filePhoto').click(); break;
    case 'b-photo-del': SH.photo = null; refreshBuilderPhoto(); break;
    case 'photo-view': {
      let list = [];
      const cap = l => [fmtShort(l.date), occName(l.occ), piecesOf(l.items).map(x => x.name).join(' + ')].filter(Boolean).join(' · ');
      if (el.dataset.key) list = comboPhotos(el.dataset.key).map(l => ({ id: l.photo, caption: cap(l) }));
      else if (el.dataset.log) { const l = D.logs.find(x => x.id === el.dataset.log); if (l && l.photo) list = [{ id: l.photo, caption: cap(l) }]; }
      else if (el.dataset.item) { const ls = D.logs.filter(l => l.photo && l.items.includes(el.dataset.item)).sort((a, b) => b.date.localeCompare(a.date)); const k = ls.findIndex(l => l.id === el.dataset.start); list = [...ls.slice(k), ...ls.slice(0, k)].map(l => ({ id: l.photo, caption: cap(l) })); }
      else if (el.dataset.pid) list = [{ id: el.dataset.pid, caption: '' }];
      if (list.length) openViewer(list); break;
    }
    case 'viewer-close': $('#viewerRoot').innerHTML = ''; break;
    case 'backup-share': if (SH && SH.file) offerFile(`rotation-backup-${todayStr()}.json`, SH.file, 'application/json'); break;
    case 'log-new': openBuilder(null); break;
    case 'log-edit': openBuilder(el.dataset.id); break;
    case 'closet-untagged': UI.tab = 'closet'; UI.cType = 'all'; UI.cOcc = 'none'; render(); window.scrollTo(0, 0); break;
    case 'ctype': UI.cType = el.dataset.k; render(); break;
    case 'cocc': UI.cOcc = el.dataset.k; render(); break;
    case 'item': openItem(el.dataset.id); break;
    case 'item-new': openItem(null); break;
    case 'it-type': { SH.type = el.dataset.k; el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b === el)); const lr = $('#itLayerRow'); if (lr) lr.hidden = isAcc(SH.type); break; }
    case 'it-occ': { const k = el.dataset.k; SH.occ = SH.occ.includes(k) ? SH.occ.filter(x => x !== k) : [...SH.occ, k]; el.setAttribute('aria-pressed', SH.occ.includes(k)); break; }
    case 'it-color': SH.color = el.dataset.k; el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'it-save': saveItem(); break;
    case 'it-wore': { const d = $('#itWoreDate').value; if (!d) return; const id = SH.id; closeSheet(); addWear(id, d); break; }
    case 'it-del': { const id = SH.id; el.dataset.orig = 'Delete this piece'; armDelete(el, 'Tap again to delete', () => { closeSheet(); commit('Piece deleted', () => { D.items = D.items.filter(x => x.id !== id); D.logs.forEach(l => { l.items = l.items.filter(x => x !== id); }); D.logs = D.logs.filter(l => l.items.length); for (const m of [D.clash, D.liked]) for (const k of Object.keys(m)) if (k.split('|').includes(id) || (m[k].layer === id)) delete m[k]; }); }); break; }
    case 'b-type': SH.type = el.dataset.k; el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b === el)); renderPickList(); break;
    case 'b-pick': pickInBuilder(el.dataset.id); break;
    case 'b-save': saveBuilder(); break;
    case 'b-del': { const id = SH.id; el.dataset.orig = 'Delete'; armDelete(el, 'Tap again', () => { closeSheet(); commit('Outfit deleted', () => { D.logs = D.logs.filter(l => l.id !== id); }); }); break; }
    case 'match-open': { const id = el.dataset.id; if (SH) closeSheet(); openMatch(id, null); break; }
    case 'm-set': { const id = el.dataset.id, v = el.dataset.v; SH.state[id] = SH.state[id] === v ? '' : v; const row = el.closest('.mrow'); row.className = 'mrow ' + SH.state[id]; row.querySelectorAll('[data-act="m-set"]').forEach(x => x.setAttribute('aria-pressed', SH.state[id] === x.dataset.v)); updateMatchCount(); break; }
    case 'm-save': saveMatch('Saved'); closeSheet(); break;
    case 'm-next': { const { id, queue } = SH; saveMatch(); closeSheet(); const nx = queue[queue.indexOf(id) + 1]; if (nx) openMatch(nx, queue); break; }
    case 'clash-del': { const k = el.dataset.k; const keep = el.dataset.keep && SH && SH.id; if (keep) closeSheet(); commit('Rule removed', () => { delete D.clash[k]; }); if (keep) openItem(keep); break; }
    case 'rest': { const k = el.dataset.k, d = Number(el.dataset.d); const v = Math.max(k === 'combo' || isAcc(k) ? 0 : 1, Math.min(120, D.rest[k] + d)); if (v === D.rest[k]) return; commit(null, () => { D.rest[k] = v; }); break; }
    case 'pick-excel': $('#fileExcel').click(); break;
    case 'pick-backup': $('#fileBackup').click(); break;
    case 'import-go': applyImport(); break;
    case 'backup-copy': copyBackup(); break;
    case 'backup-file': prepareBackupFile(); break;
    case 'restore-paste': openRestorePaste(); break;
    case 'restore-go': restoreFrom($('#rsText').value); break;
    case 'restore-confirm': {
      const { d, photos } = SH; closeSheet(); commit('Backup restored', () => { D = d; }); UI.occ = validOcc(UI.occ) ? UI.occ : dayOcc(UI.date); render();
      if (photos) (async () => { for (const [id, url] of Object.entries(photos)) { try { await photoPut(id, dataURLToBlob(url)); } catch (e) {} } render(); })();
      break;
    }
    case 'csv': exportCSV(); break;
    case 'erase': el.dataset.orig = 'Erase'; armDelete(el, 'Tap again', () => { commit('Everything erased', () => { D = blank(); D.washes = [baseWash(todayStr(), Date.now())]; }); photoClear().catch(() => {}); }); break;
    case 'sheet-close': closeSheet(); break;
    case 'undo': { const u = toast.undo; $('#toastRoot').innerHTML = ''; toast.undo = null; if (u) u(); break; }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'closetQ') { UI.q = t.value; $('#closetList').innerHTML = closetList(); }
  else if (t.id === 'bQ' && SH) { SH.q = t.value; renderPickList(); }
  else if (t.id === 'mQ' && SH) { SH.q = t.value; refreshMatch(); }
  else if (t.id === 'cutSize' && SH) SH.size = Number(t.value);
  else if (t.id === 'cutEdge' && SH && SH.kind === 'cut' && SH.res && SH.res.method === 'model') { SH.edge = Number(t.value); queueCut(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dateInput' && t.value) { UI.date = t.value; UI.occ = dayOcc(UI.date); render(); }
  else if (t.id === 'filePhoto' && t.files[0]) { addPhoto(t.files[0], UI.photoFor); t.value = ''; }
  else if (t.id === 'filePic' && t.files[0]) { const f = t.files[0]; t.value = ''; openCutout(f, UI.picBack || { id: null, draft: {} }); }
  else if (t.id === 'cutEdge' && SH && SH.kind === 'cut' && SH.res) { const v = Number(t.value);
    if (SH.res.method === 'plain') { SH.base = Cutout.plainMask(SH.res.canvas, 8 + v * 0.7); } else SH.edge = v; queueCut(); }
  else if (t.id === 'closetSort') { UI.cSort = t.value; $('#closetList').innerHTML = closetList(); saveUI(); }
  else if (t.id === 'bDate' && SH && t.value) { SH.date = t.value; refreshBuilder(); }
  else if (t.id === 'bOcc' && SH) { SH.occ = t.value; renderPickList(); }
  else if (t.id === 'mOnly' && SH) { SH.only = t.checked; updateMatchCount(); }
  else if (t.dataset.imp !== undefined && SH && SH.res) { SH.res.items[Number(t.dataset.imp)].type = t.value; }
  else if (t.dataset.occ) { const id = t.dataset.occ, v = t.value.trim(); if (!v) { render(); return; } commit(null, () => { D.occasions.find(o => o.id === id).name = v; }); }
  else if (t.id === 'fileExcel' && t.files[0]) { readExcelFile(t.files[0]); t.value = ''; }
  else if (t.id === 'fileBackup' && t.files[0]) { t.files[0].text().then(restoreFrom); t.value = ''; }
});
document.addEventListener('scroll', e => { const el = e.target; if (el && el.classList && el.classList.contains('mm-scroll')) { UI.mmScroll = UI.mmScroll || {}; UI.mmScroll[el.dataset.key] = el.scrollLeft; } }, true);
document.addEventListener('paste', e => {
  if (!SH || (SH.kind !== 'item' && SH.kind !== 'run')) return;
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => x.type.startsWith('image/'));
  if (!f) return;
  e.preventDefault();
  openCutout(f, SH.kind === 'run' ? { run: { queue: SH.queue, idx: SH.idx }, id: SH.queue[SH.idx], auto: true } : { id: SH.id, draft: itemDraft(), auto: true });
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('#viewerRoot').innerHTML) $('#viewerRoot').innerHTML = ''; else if ($('#sheetRoot').innerHTML) closeSheet(); });
document.addEventListener('click', e => { if (e.target.id === 'dateInput') { try { e.target.showPicker(); } catch (x) {} } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayStr();
  if (UI.lastToday && UI.lastToday !== t) { reindex(); if (UI.date === UI.lastToday) { UI.date = t; UI.occ = dayOcc(t); } UI.pk = null; if (!SH) render(); }
  UI.lastToday = t;
});
UI.lastToday = todayStr();

reindex();
render();
if (D.sample && !lsGet('lemari:welcomed')) openWelcome(0);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__lemari = { get D() { return D; }, get UI() { return UI; }, interpretGrid, readXlsx, newPicker, render, st: (id, d) => st(IX.byId.get(id), d), laundryNow: id => laundryNow(IX.byId.get(id)) };
})();
</script>
